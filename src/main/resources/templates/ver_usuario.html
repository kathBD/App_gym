<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ver Usuario | VibraFit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
        background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('/img/fuerza.jpg');
        background-size: cover; background-position: center; background-attachment: fixed;
        min-height: 100vh; font-family: 'Segoe UI', Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 20px; margin: 0; color: white;
    }
    .glass-panel {
        background: rgba(15,15,15,0.85); backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
        padding: 40px; width: 100%; max-width: 800px;
    }
    .form-control, .form-select {
    background-color: rgba(255,255,255,0.05) !important;
    border: 1px solid rgba(255,255,255,0.15);
    color: white !important;
    border-radius: 10px;
    padding: 12px;
}

.form-control:focus, .form-select:focus {
    background-color: rgba(255,255,255,0.1) !important;
    border-color: #00d2ff;
    color: white !important;
    box-shadow: 0 0 0 0.25rem rgba(0,210,255,0.25);
    outline: none;
}

/* Fix para input type date */
input[type="date"] {
    color-scheme: dark;
    color: white !important;
}

/* Fix para autofill del navegador */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
    -webkit-text-fill-color: white !important;
    -webkit-box-shadow: 0 0 0px 1000px rgba(15,15,15,0.85) inset !important;
}
    h2 { font-weight: 700; text-transform: uppercase; color: white; text-align: center; margin-bottom: 30px; }
    .info-label {
        color: #00d2ff; font-weight: 600; font-size: 0.85rem;
        text-transform: uppercase; letter-spacing: 0.5px;
        display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
    }
    .info-value {
        color: white; font-size: 1rem; font-weight: 500;
        padding: 10px 15px; background: rgba(255,255,255,0.05);
        border-radius: 8px; border-left: 3px solid #00d2ff;
        margin-bottom: 15px;
    }
    .status-active {
        background: rgba(46,204,113,0.2); color: #2ecc71;
        border: 1px solid rgba(46,204,113,0.3);
        padding: 5px 15px; border-radius: 20px; font-weight: 600;
    }
    .status-inactive {
        background: rgba(255,71,87,0.2); color: #ff4757;
        border: 1px solid rgba(255,71,87,0.3);
        padding: 5px 15px; border-radius: 20px; font-weight: 600;
    }
    .btn-primary-vibra {
        background: linear-gradient(135deg, #00d2ff, #0099ff);
        border: none; color: white; padding: 10px 25px;
        border-radius: 10px; font-weight: 600;
    }
    .btn-back { color: #aaa; text-decoration: none; font-weight: 500; }
    .btn-back:hover { color: white; }
  </style>
</head>
<body>
<div class="glass-panel">
  <div class="text-center mb-4">
    <img src="/img/logo.jpg" alt="Logo" width="60" class="rounded-circle border border-info mb-2">
    <h2>Detalles del Usuario</h2>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="info-label"><i class="bi bi-person"></i> Nombre</div>
      <div class="info-value" th:text="${usuario.nombre}"></div>

      <div class="info-label"><i class="bi bi-envelope"></i> Correo</div>
      <div class="info-value" th:text="${usuario.correo}"></div>

      <div class="info-label"><i class="bi bi-telephone"></i> Teléfono</div>
      <div class="info-value" th:text="${usuario.telefono ?: 'No especificado'}"></div>

      <div class="info-label"><i class="bi bi-calendar"></i> Fecha Nacimiento</div>
      <div class="info-value" th:text="${usuario.fechaNacimiento ?: 'No especificada'}"></div>
    </div>
    <div class="col-md-6">
      <div class="info-label"><i class="bi bi-person-badge"></i> Rol</div>
      <div class="info-value" th:text="${usuario.rol.nombre}"></div>

      <div class="info-label"><i class="bi bi-toggle-on"></i> Estado</div>
      <div class="info-value">
                <span th:if="${usuario.activo}" class="status-active">
                    <i class="bi bi-check-circle me-1"></i> Activo
                </span>
        <span th:unless="${usuario.activo}" class="status-inactive">
                    <i class="bi bi-x-circle me-1"></i> Inactivo
                </span>
      </div>

      <div class="info-label"><i class="bi bi-bullseye"></i> Objetivo</div>
      <div class="info-value" th:text="${usuario.objetivo ?: 'No especificado'}"></div>

      <div class="info-label"><i class="bi bi-clock-history"></i> Fecha Registro</div>
      <div class="info-value" th:text="${usuario.fechaRegistro ?: 'No disponible'}"></div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <a href="/usuarios" class="btn-back">
      <i class="bi bi-arrow-left me-1"></i> Volver a la Lista
    </a>
    <a th:href="@{/usuarios/editar/{id}(id=${usuario.usuarioId})}" class="btn btn-primary-vibra">
      <i class="bi bi-pencil-square me-1"></i> Editar Usuario
    </a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
