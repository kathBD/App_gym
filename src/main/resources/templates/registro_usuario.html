<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.usuarioId != null ? 'Editar Usuario' : 'Nuevo Usuario'} + ' | VibraFit'">Formulario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/img/fuerza.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px; margin: 0; color: white;
        }
        .glass-panel {
            background: rgba(15,15,15,0.85); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 40px; width: 100%; max-width: 900px;
        }
        h2 { font-weight: 700; text-transform: uppercase; color: white; text-align: center; margin-bottom: 30px; }
        .form-label { color: #00d2ff; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        .form-control, .form-select {
            background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white !important; border-radius: 10px; padding: 12px;
        }
        .form-control:focus, .form-select:focus { border-color: #00d2ff; outline: none; }
        .form-select option { background-color: #1a1a1a; color: white; }
        .section-title {
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
            margin: 30px 0 20px 0; font-size: 1rem; color: #aaa; font-weight: 600; text-transform: uppercase;
        }
        .btn-primary-vibra {
            background: linear-gradient(135deg, #00d2ff, #0099ff); border: none;
            color: white; padding: 12px 30px; border-radius: 10px; font-weight: 600;
        }
        .btn-cancel {
            background: transparent; border: 1px solid #ff4757; color: #ff4757;
            padding: 12px 30px; border-radius: 10px; font-weight: 600;
        }
        .btn-cancel:hover { background: #ff4757; color: white; }
    </style>
</head>
<body>
<div class="glass-panel">
    <div class="text-center mb-4">
        <img src="/img/logo.jpg" alt="Logo" width="60" class="rounded-circle border border-info mb-2">
        <h2 th:text="${usuario.usuarioId != null ? 'Editar Usuario' : 'Registrar Nuevo Usuario'}"></h2>
    </div>

    <div th:if="${mensaje}" class="alert alert-success">
        <i class="bi bi-check2-circle me-2"></i> <span th:text="${mensaje}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{usuarioId}" />

        <div class="section-title">Información de Acceso</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" th:field="*{nombre}" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" th:field="*{correo}" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" th:field="*{password}"
                       th:required="${usuario.usuarioId == null}" />
                <small class="text-muted" th:if="${usuario.usuarioId != null}">Dejar en blanco para no cambiar</small>
            </div>
            <div class="col-md-6">
                <label class="form-label">Rol de Usuario</label>
                <select class="form-select" th:field="*{rol.rolId}" required>
                    <option th:each="rol : ${roles}" th:value="${rol.rolId}" th:text="${rol.nombre}"></option>
                </select>
            </div>
        </div>

        <div class="section-title">Datos Personales</div>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:field="*{telefono}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Sexo</label>
                <select class="form-select" th:field="*{sexo}">
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Fecha Nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}" required />
            </div>
            <div class="col-md-3">
                <label class="form-label">Peso (kg)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{peso}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Estatura (m)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{estatura}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Estado Físico</label>
                <input type="text" class="form-control" th:field="*{estadoFisico}" />
            </div>
        </div>

        <div class="section-title">Perfil Deportivo</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Objetivo</label>
                <input type="text" class="form-control" th:field="*{objetivo}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Especialidad</label>
                <input type="text" class="form-control" th:field="*{especialidad}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Horario Inicio</label>
                <input type="time" class="form-control" th:field="*{horarioInicio}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Horario Fin</label>
                <input type="time" class="form-control" th:field="*{horarioFin}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Estado Cuenta</label>
                <select class="form-select" th:field="*{activo}">
                    <option th:value="${true}">Activo</option>
                    <option th:value="${false}">Inactivo</option>
                </select>
            </div>
        </div>

        <div class="mt-5 d-flex justify-content-between">
            <a href="/usuarios" class="btn btn-cancel">
                <i class="bi bi-x-circle me-2"></i>Cancelar
            </a>
            <button type="submit" class="btn btn-primary-vibra">
                <i class="bi bi-save me-2"></i>Guardar Cambios
            </button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
