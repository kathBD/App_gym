spring.application.name=app-gym
server.port=${PORT:8080}
# ── CONFIGURACIÓN DE BASE DE DATOS (HÍBRIDA) ────────────────
# 1. Intenta usar la variable de Render (DB_URL)
# 2. Si no existe, usa la de tu Docker local (jdbc:mysql://db:3306/vibrafitapp)
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/vibrafitapp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Test1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── ESTRATEGIA DE CARGA DE DATOS AUTOMÁTICA ────────────────
# 'always' activa la lectura del archivo src/main/resources/import.sql
spring.jpa.hibernate.ddl-auto=update
# Permite que el despliegue continúe si intentas insertar algo que ya existe
spring.sql.init.continue-on-error=true

# ── CONFIGURACIÓN JPA / HIBERNATE ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialecto específico para MySQL 8 (el que usa Railway) para evitar errores de sintaxis
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Soluciona problemas de carga perezosa
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ── SEGURIDAD Y JWT ─────────────────────────────────────────
jwt.secret=vibrafit2024_clave_super_secreta_segura
jwt.expiration=86400000

# ── LOGGING ─────────────────────────────────────────────────
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.com.sena.appspringboot=DEBUG
logging.level.org.hibernate.SQL=DEBUG