spring.application.name=app-gym

# ── CONFIGURACIÓN DE BASE DE DATOS (HÍBRIDA) ────────────────
# 1. Intenta usar la variable de Render (DB_URL)
# 2. Si no existe, usa la de tu Docker local (jdbc:mysql://db:3306/vibrafitapp)
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/vibrafitapp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Test1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── CONFIGURACIÓN JPA / HIBERNATE ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Usamos un dialecto compatible con MySQL 8 y MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Soluciona problemas de carga perezosa
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ── SEGURIDAD Y JWT ─────────────────────────────────────────
jwt.secret=vibrafit2024_clave_super_secreta_segura
jwt.expiration=86400000

# ── LOGGING (Nivel INFO para producción, DEBUG para desarrollo) 
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.com.sena.appspringboot=DEBUG
# Si quieres ver las consultas SQL en consola (útil al principio)
logging.level.org.hibernate.SQL=DEBUG