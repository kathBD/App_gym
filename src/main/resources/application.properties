spring.application.name=app-gym

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/vibrafitapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Test1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (solo una vez)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=vibrafit2024_clave_super_secreta_segura
jwt.expiration=86400000

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.sena.appspringboot=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Soluciona problemas de LazyInitializationException
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

